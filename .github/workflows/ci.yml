name: Onyx CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest
      - run: ruff check app.py brain services tests
      - run: mypy services brain --ignore-missing-imports
      - run: bandit -r app.py brain services -x '*/__pycache__/*'
