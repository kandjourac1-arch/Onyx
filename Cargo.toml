[package]
name = "onyx-rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "onyx_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1.0"
thiserror = "1.0"
md5 = "0.7"
sha1 = "0.10"
sha2 = "0.10"
sysinfo = "0.33"
